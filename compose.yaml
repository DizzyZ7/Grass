services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grass
      POSTGRES_USER: grass
      POSTGRES_PASSWORD: grass
    volumes:
      - grass_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grass -d grass"]
      interval: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://grass:grass@db:5432/grass
      BOT_TOKEN: ${BOT_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEV_MODE: ${DEV_MODE:-true}
      PORT: 8000
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  grass_pg:
